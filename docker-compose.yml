services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: simac-app
    container_name: simac-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simac

  webserver:
    image: nginx:1.27-alpine
    container_name: simac-webserver
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - simac

  db:
    image: mysql:8.0
    container_name: simac-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simac}
      MYSQL_USER: ${DB_USERNAME:-simac}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-3308}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - simac

  phpmyadmin:
    image: phpmyadmin:5
    container_name: simac-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8091}:80"
    depends_on:
      - db
    networks:
      - simac

networks:
  simac:
    driver: bridge

volumes:
  dbdata:
    driver: local
